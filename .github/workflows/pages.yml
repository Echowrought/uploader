name: Website
on:
  push:
    branches: [master]
    paths:
    - 'site/**'
    - 'assets/icon.svg'
    - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Include shared app icon
      run: |
        mkdir -p site/assets
        cp assets/icon.svg site/assets/icon.svg
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      id: upload
      with:
        path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    # A finalized upload may not be listed immediately (actions/deploy-pages#451).
    - name: Wait for the Pages artifact to be listed
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      run: |
        if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
          echo '::error::The build job did not report a Pages artifact ID.'
          exit 1
        fi
        endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
        for delay in 0 1 2 4 8 16; do
          if (( delay > 0 )); then sleep "$delay"; fi
          if visible=$(timeout 8s gh api "$endpoint" --jq '.artifacts[] | select(.expired == false) | .id') &&
             [[ "$visible" == "$ARTIFACT_ID" ]]; then
            echo "Pages artifact $ARTIFACT_ID is ready."
            exit 0
          fi
        done
        echo "::error::Expected only Pages artifact $ARTIFACT_ID to be visible. If duplicate artifacts exist, start a fresh workflow run."
        exit 1
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
