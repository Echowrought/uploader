name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOOS: windows
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: ''
      GOEXPERIMENT: ''
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.27.3'
    - name: Build and test
      run: |
        if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
          throw 'Release tags must use vX.Y.Z: non-negative integers without leading zeros'
        }
        if (git status --porcelain) { throw 'Release builds require a clean checkout' }
        ./build.ps1
    - name: Build installer
      run: |
        $compiler = & ./scripts/install-inno.ps1 -Destination "$env:RUNNER_TEMP\inno-setup"
        & ./scripts/build-installer.ps1 -Version $env:GITHUB_REF_NAME -ISCCPath $compiler
        "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Record build information
      run: |
        $goEnvironment = go env -json GOVERSION GOOS GOARCH GOAMD64 CGO_ENABLED GOTOOLCHAIN GOFLAGS GOEXPERIMENT
        if ($LASTEXITCODE -ne 0) { throw 'Could not read Go build settings' }
        $executables = @(Get-ChildItem ./dist/*.exe | Sort-Object Name | ForEach-Object {
          [ordered]@{
            name = $_.Name
            sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
        })
        $actions = @(Select-String -Path .github/workflows/release.yml -Pattern '^\s*(?:-\s*)?uses:\s*(\S+)' |
          ForEach-Object { $_.Matches[0].Groups[1].Value })
        [ordered]@{
          repository = $env:GITHUB_REPOSITORY
          source_ref = $env:GITHUB_REF
          source_commit = $env:GITHUB_SHA
          workflow = $env:GITHUB_WORKFLOW_REF
          workflow_commit = $env:GITHUB_WORKFLOW_SHA
          run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/$env:GITHUB_RUN_ATTEMPT"
          runner_os = $env:RUNNER_OS
          runner_arch = $env:RUNNER_ARCH
          runner_image = $env:ImageOS
          runner_image_version = $env:ImageVersion
          powershell_version = $PSVersionTable.PSVersion.ToString()
          go = ($goEnvironment | ConvertFrom-Json)
          inno_setup = [ordered]@{
            version = (Get-Item $env:INNO_COMPILER).VersionInfo.ProductVersion
            compiler_sha256 = (Get-FileHash $env:INNO_COMPILER -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          actions = $actions
          executables = $executables
        } | ConvertTo-Json -Depth 5 | Set-Content build-info.json -Encoding utf8
    - name: Package
      run: |
        $tag = $env:GITHUB_REF_NAME
        $docs = @(
          "./dist/README.md"
          "./dist/VERIFYING.md"
          "./dist/LICENSE"
          "./dist/THIRD_PARTY_NOTICES.md"
        )

        Compress-Archive `
          -Path (@("./dist/cwg-rpg-uploader.exe") + $docs) `
          -DestinationPath "cwg-rpg-uploader-$tag-windows-amd64.zip"

        Compress-Archive `
          -Path (@("./dist/cwg-rpg-uploader-console.exe") + $docs) `
          -DestinationPath "cwg-rpg-uploader-console-$tag-windows-amd64.zip"
    - name: Attest release files
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          cwg-rpg-uploader-*.zip
          dist/cwg-rpg-uploader-*-setup.exe
          build-info.json
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = $env:GITHUB_REF_NAME
        $tray = "cwg-rpg-uploader-$tag-windows-amd64.zip"
        $console = "cwg-rpg-uploader-console-$tag-windows-amd64.zip"
        $installer = "cwg-rpg-uploader-$tag-windows-amd64-setup.exe"
        $repository = $env:GITHUB_REPOSITORY
        $download = "$env:GITHUB_SERVER_URL/$repository/releases/download/$tag"
        $verification = "$env:GITHUB_SERVER_URL/$repository/blob/$tag/VERIFYING.md"
        @"
        ## Downloads
        - [Windows installer (tray app)]($download/$installer)
        - [Portable Windows tray app]($download/$tray)
        - [Portable Windows console app]($download/$console)

        Quit the uploader before installing or upgrading. Setup installs for the current user without administrator rights and does not launch the app. Start it from the Start menu when ready. Configuration/history are retained on upgrades and uninstall.

        For portable use, extract the ZIP and launch the executable. Starting either app enables automatic save uploads by default; read the included README first. Executables and setup are unsigned, so Windows SmartScreen may display a warning.

        ## Verify this release
        This section is for geeks. Or those who really want to check where their download came from.

        Follow the [verification instructions]($verification) to check this release's attestations, or rebuild [this tag]($env:GITHUB_SERVER_URL/$repository/tree/$tag) yourself and compare executable hashes. No team access is needed.
        "@ | Set-Content release-notes.md -Encoding utf8
        gh release create "$tag" "$tray" "$console" "./dist/$installer" build-info.json `
          --verify-tag `
          --draft `
          --prerelease `
          --title "$tag" `
          --notes-file release-notes.md `
          --generate-notes
        if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
