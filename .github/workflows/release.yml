name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: ''
      GOEXPERIMENT: ''
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.27.3'
    - name: Test and build Linux console
      run: |
        if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
          throw 'Release tags must use vX.Y.Z: non-negative integers without leading zeros'
        }
        if (git status --porcelain) { throw 'Release builds require a clean checkout' }
        ./scripts/check.ps1
        ./build-linux.ps1 -Version $env:GITHUB_REF_NAME
    - name: Record Linux build information
      run: |
        $goEnvironment = go env -json GOVERSION GOOS GOARCH GOAMD64 CGO_ENABLED GOTOOLCHAIN GOFLAGS GOEXPERIMENT
        if ($LASTEXITCODE -ne 0) { throw 'Could not read Go build settings' }
        $actions = @(Select-String -Path .github/workflows/release.yml -Pattern '^\s*(?:-\s*)?uses:\s*(\S+)' |
          ForEach-Object { $_.Matches[0].Groups[1].Value })
        [ordered]@{
          repository = $env:GITHUB_REPOSITORY
          source_ref = $env:GITHUB_REF
          source_commit = $env:GITHUB_SHA
          workflow = $env:GITHUB_WORKFLOW_REF
          workflow_commit = $env:GITHUB_WORKFLOW_SHA
          run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/$env:GITHUB_RUN_ATTEMPT"
          runner_os = $env:RUNNER_OS
          runner_arch = $env:RUNNER_ARCH
          runner_image = $env:ImageOS
          runner_image_version = $env:ImageVersion
          powershell_version = $PSVersionTable.PSVersion.ToString()
          go = ($goEnvironment | ConvertFrom-Json)
          actions = $actions
          executables = @([ordered]@{
            name = 'cwg-rpg-uploader-console'
            sha256 = (Get-FileHash ./dist-linux/cwg-rpg-uploader-console -Algorithm SHA256).Hash.ToLowerInvariant()
          })
        } | ConvertTo-Json -Depth 5 | Set-Content linux-build-info.json -Encoding utf8
    - name: Package Linux console
      run: |
        tar -czf "cwg-rpg-uploader-console-$env:GITHUB_REF_NAME-linux-amd64.tar.gz" -C dist-linux .
        if ($LASTEXITCODE -ne 0) { throw 'Linux packaging failed' }
    - name: Attest Linux release files
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          cwg-rpg-uploader-console-*-linux-amd64.tar.gz
          linux-build-info.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: linux-release-files
        path: |
          cwg-rpg-uploader-console-*-linux-amd64.tar.gz
          linux-build-info.json
        if-no-files-found: error
        overwrite: true
        retention-days: 1
  release:
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOOS: windows
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: ''
      GOEXPERIMENT: ''
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.27.3'
    - name: Build and test
      run: |
        if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
          throw 'Release tags must use vX.Y.Z: non-negative integers without leading zeros'
        }
        if (git status --porcelain) { throw 'Release builds require a clean checkout' }
        ./build.ps1 -Version $env:GITHUB_REF_NAME
    - name: Build installer
      run: |
        $compiler = & ./scripts/install-inno.ps1 -Destination "$env:RUNNER_TEMP\inno-setup"
        & ./scripts/build-installer.ps1 -Version $env:GITHUB_REF_NAME -ISCCPath $compiler
        "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Record build information
      run: |
        $goEnvironment = go env -json GOVERSION GOOS GOARCH GOAMD64 CGO_ENABLED GOTOOLCHAIN GOFLAGS GOEXPERIMENT
        if ($LASTEXITCODE -ne 0) { throw 'Could not read Go build settings' }
        $executables = @(Get-ChildItem ./dist/*.exe | Sort-Object Name | ForEach-Object {
          [ordered]@{
            name = $_.Name
            sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
        })
        $actions = @(Select-String -Path .github/workflows/release.yml -Pattern '^\s*(?:-\s*)?uses:\s*(\S+)' |
          ForEach-Object { $_.Matches[0].Groups[1].Value })
        [ordered]@{
          repository = $env:GITHUB_REPOSITORY
          source_ref = $env:GITHUB_REF
          source_commit = $env:GITHUB_SHA
          workflow = $env:GITHUB_WORKFLOW_REF
          workflow_commit = $env:GITHUB_WORKFLOW_SHA
          run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/$env:GITHUB_RUN_ATTEMPT"
          runner_os = $env:RUNNER_OS
          runner_arch = $env:RUNNER_ARCH
          runner_image = $env:ImageOS
          runner_image_version = $env:ImageVersion
          powershell_version = $PSVersionTable.PSVersion.ToString()
          go = ($goEnvironment | ConvertFrom-Json)
          inno_setup = [ordered]@{
            version = (Get-Item $env:INNO_COMPILER).VersionInfo.ProductVersion
            compiler_sha256 = (Get-FileHash $env:INNO_COMPILER -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          actions = $actions
          executables = $executables
        } | ConvertTo-Json -Depth 5 | Set-Content build-info.json -Encoding utf8
    - name: Package
      run: |
        $tag = $env:GITHUB_REF_NAME
        $docs = @(
          "./dist/README.md"
          "./dist/CONFIGURATION.md"
          "./dist/VERIFYING.md"
          "./dist/LICENSE"
          "./dist/THIRD_PARTY_NOTICES.md"
        )

        Compress-Archive `
          -Path (@("./dist/cwg-rpg-uploader.exe") + $docs) `
          -DestinationPath "cwg-rpg-uploader-$tag-windows-amd64.zip"

        Compress-Archive `
          -Path (@("./dist/cwg-rpg-uploader-console.exe") + $docs) `
          -DestinationPath "cwg-rpg-uploader-console-$tag-windows-amd64.zip"
    - name: Attest release files
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          cwg-rpg-uploader-*.zip
          dist/cwg-rpg-uploader-*-setup.exe
          build-info.json
    - name: Download Linux release files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: linux-release-files
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = $env:GITHUB_REF_NAME
        $tray = "cwg-rpg-uploader-$tag-windows-amd64.zip"
        $console = "cwg-rpg-uploader-console-$tag-windows-amd64.zip"
        $installer = "cwg-rpg-uploader-$tag-windows-amd64-setup.exe"
        $linux = "cwg-rpg-uploader-console-$tag-linux-amd64.tar.gz"
        $repository = $env:GITHUB_REPOSITORY
        $download = "$env:GITHUB_SERVER_URL/$repository/releases/download/$tag"
        $verification = "$env:GITHUB_SERVER_URL/$repository/blob/$tag/VERIFYING.md"
        @"
        ## Upload and privacy notice

        **Launching this app enables automatic uploads by default, including existing saves.** Save contents are sent to a [third-party public leaderboard](https://cwg2-leaderboard.rskiland.workers.dev/#leaderboard), and submissions may appear publicly.

        The app uploads eligible **.pld files directly inside the selected CWG save folder**, including unknown save categories. **Subfolders are never scanned.** Uploads respect settling and safety limits.

        This app never modifies your game saves. Read the included README before launching.

        ## Downloads
        - [Windows installer (tray app)]($download/$installer)
        - [Portable Windows tray app]($download/$tray)
        - [Portable Windows console app]($download/$console)
        - [Linux console app (x86-64)]($download/$linux)

        Setup installs for the current user without administrator rights and offers shortcut and sign-in startup choices. Upgrades use Windows Restart Manager to request graceful closure of the installed app. The final launch option is checked by default; uncheck it to leave the app stopped. Silent setup never launches it. Configuration/history are retained on upgrades and uninstall.

        For portable use, extract the ZIP and launch the executable. Starting either app enables automatic save uploads by default; read the included README first. Executables and setup are unsigned, so Windows SmartScreen may display a warning.

        Linux is console-only: extract the archive, then start with --dry-run --save-folder followed by the absolute Wine/Proton CWG save-folder path to inspect saves without uploading. Omit --dry-run only when ready for real uploads. No tray, installer, Wine-prefix discovery, or automatic startup is provided on Linux.

        ## Verify this release
        This section is for geeks. Or those who really want to check where their download came from.

        Follow the [verification instructions]($verification) to check this release's attestations, or rebuild [this tag]($env:GITHUB_SERVER_URL/$repository/tree/$tag) yourself and compare executable hashes. No team access is needed.
        "@ | Set-Content release-notes.md -Encoding utf8
        gh release create "$tag" "$tray" "$console" "./dist/$installer" "$linux" build-info.json linux-build-info.json `
          --verify-tag `
          --draft `
          --prerelease `
          --title "$tag" `
          --notes-file release-notes.md `
          --generate-notes
        if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
