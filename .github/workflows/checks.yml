name: Pull request checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    name: PR checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows
          runner: windows-latest
          platform: windows
        - name: Linux
          runner: ubuntu-latest
          platform: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GOOS: ${{ matrix.platform }}
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: ''
      GOEXPERIMENT: ''
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version: '1.27.3'
    - name: Lint, test, and vet
      run: ./scripts/check.ps1
    - name: Build Linux console package
      if: matrix.platform == 'linux'
      run: ./build-linux.ps1
